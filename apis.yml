description: Tulipshare is a London-based impact investor and shareholder advocacy
  group that uses activist investing to push for ethical and sustainable change at
  the world's largest companies. It leverages shareholder proposals, direct board
  and ESG-team engagement, and other shareholder rights on behalf of foundations,
  asset managers, universities, and pension funds. Backed by Speedinvest. Its
  consumer website (tulipshare.com) went offline in 2026 and the company publishes
  no public API surface.
